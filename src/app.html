<!doctype html>

<html lang="%paraglide.lang%" dir="%paraglide.dir%" class="scroll-smooth" data-theme="berry">
	<head>
		<meta charset="utf-8" />

		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no"
		/>

		<meta name="text-scale" content="scale" />

		<!-- Partytown setup for Zero-JS analytics -->
		<script>
			partytown = {
				forward: ['dataLayer.push', 'gtag']
			};
		</script>
		<script type="text/javascript" src="/~partytown/partytown.js"></script>

		<!-- Google Analytics (Partytown) Placeholder -->
		<script type="text/partytown" src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
		<script type="text/partytown">
			window.dataLayer = window.dataLayer || [];
			function gtag(){dataLayer.push(arguments);}
			gtag('js', new Date());
			gtag('config', 'G-XXXXXXXXXX');
		</script>

		<!-- Google AdSense (Partytown) Placeholder -->
		<script type="text/partytown" async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>

		<!-- Theme initialization to prevent flashing -->
		<script>
			(function() {
				var savedTheme = localStorage.getItem('if_theme_final') || 'apple';
				document.documentElement.setAttribute('data-theme', savedTheme);
			})();
		</script>

		%sveltekit.head%
	</head>

	<body class="antialiased" data-sveltekit-preload-data="hover"><div style="display: contents">%sveltekit.body%</div></body>
</html>
