name: Production Deployment

on:
  push:
    branches: [ main ]
  workflow_run:
    workflows: ["Lighthouse Guard"]
    types:
      - completed

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Security Audit
        run: npm audit --audit-level=high
        
      - name: Build Production Bundle
        run: npm run build
        
      - name: Sync Assets to AWS S3
        # This ensures high-res assets are delivered via CloudFront CDN
        # Requires AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, and S3_BUCKET_NAME secrets
        if: success() && github.ref == 'refs/heads/main'
        run: |
          aws s3 sync static/ s3://${{ secrets.S3_BUCKET_NAME }}/assets/ --delete --acl public-read
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: 'us-east-1'
        
      - name: Deploy to Vercel (Production)
        # Using Vercel CLI for zero-downtime atomic deployments
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./
